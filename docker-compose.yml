# LOCAL DEV ONLY — do not use for production or internet-facing deployments.
# API binds to 127.0.0.1 (loopback) to prevent accidental exposure.
# Auth is expected to be enabled via .env for any shared environment.
version: "3.8"

services:
  # Backend API server with all physics engines
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: upstream-drift:runtime
    container_name: upstream-drift-backend
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace:delegated
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/golfer/.local/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATABASE_URL=sqlite:////workspace/golf_modeling_suite.db
      - API_HOST=127.0.0.1
      - API_PORT=8001
      - ENVIRONMENT=development
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}
    command: python3 -m uvicorn src.api.server:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - upstream-drift

  # Frontend UI (optional - can also run locally)
  frontend:
    image: node:20-alpine
    container_name: upstream-drift-frontend
    ports:
      - "5180:5180"
    volumes:
      - ./ui:/app:delegated
      - node_modules:/app/node_modules
    working_dir: /app
    # node_modules volume prevents re-running npm install on every container start.
    # Run `docker compose run frontend npm ci` once to populate the volume.
    command: sh -c "[ -d node_modules/.bin ] || npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - upstream-drift

  # Training stage for advanced ML workflows
  training:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    image: upstream-drift:training
    container_name: upstream-drift-training
    volumes:
      - .:/workspace:delegated
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    networks:
      - upstream-drift

networks:
  upstream-drift:
    driver: bridge

volumes:
  node_modules:
