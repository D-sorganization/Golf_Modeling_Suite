name: Docker Security Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
  schedule:
    # Weekly scan on Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Container Scan
    runs-on: self-hosted
    env:
      TRIVY_SCANNERS: vuln
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t upstreamdrift:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "upstreamdrift:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          # Don't fail the build initially - triage first
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: success()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table output for PR comments)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "upstreamdrift:ci"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"
          # Exit with error only on CRITICAL vulnerabilities
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Image smoke test
        run: |
          # Verify the built image can start and respond on /health within 30 s.
          docker run -d --name smoke-test -p 8001:8001 \
            -e MUJOCO_GL=osmesa \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            upstreamdrift:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health; then
              echo "Health check passed on attempt $i"
              break
            fi
            [ "$i" -eq 30 ] && echo "Health check timed out" && exit 1
            sleep 1
          done
        env:
          DOCKER_BUILDKIT: "1"
