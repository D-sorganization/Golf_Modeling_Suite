name: SBOM Generation

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom-core:
    name: SBOM — core tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: Install core dependencies
        run: pip install -e "."

      - name: Install CycloneDX
        run: pip install "cyclonedx-bom>=4.0.0"

      - name: Generate SBOM (core)
        run: cyclonedx-py environment --schema-version 1.4 --output-file sbom-core.cdx.json

      - name: Upload SBOM artifact (core)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-core
          path: sbom-core.cdx.json
          retention-days: 90

  sbom-extended:
    name: SBOM — extended tier (drake, pinocchio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: Install extended dependencies
        run: pip install -e ".[drake,pinocchio]"

      - name: Install CycloneDX
        run: pip install "cyclonedx-bom>=4.0.0"

      - name: Generate SBOM (extended)
        run: cyclonedx-py environment --schema-version 1.4 --output-file sbom-extended.cdx.json

      - name: Upload SBOM artifact (extended)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-extended
          path: sbom-extended.cdx.json
          retention-days: 90

  sbom-experimental:
    name: SBOM — experimental tier (opensim, myosuite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: Install experimental dependencies
        run: pip install -e ".[opensim,myosuite]"

      - name: Install CycloneDX
        run: pip install "cyclonedx-bom>=4.0.0"

      - name: Generate SBOM (experimental)
        run: cyclonedx-py environment --schema-version 1.4 --output-file sbom-experimental.cdx.json

      - name: Upload SBOM artifact (experimental)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-experimental
          path: sbom-experimental.cdx.json
          retention-days: 90
