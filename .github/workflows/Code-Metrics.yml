name: Code Metrics

# Informational code quality metrics - never fails CI
# Reports complexity (radon) and duplication (jscpd) metrics

on:
  # COST OPTIMIZATION: Schedule removed. This is an informational report — run manually via workflow_dispatch.
  # Was: cron "0 0 * * 0,4" (twice-weekly cloud runs wasting ~10 min/run across 3 repos)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/actions/runners --paginate \
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  duplication-metrics:
    needs: pick-runner
    name: Duplication Analysis (jscpd)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Run Duplication Analysis
        run: |
          echo "## Code Duplication Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Create jscpd config
          cat > .jscpd.json << 'EOF'
          {
            "threshold": 0,
            "reporters": ["console", "json"],
            "ignore": [
              "**/node_modules/**",
              "**/.git/**",
              "**/venv/**",
              "**/.venv/**",
              "**/archive/**",
              "**/legacy/**",
              "**/__pycache__/**",
              "**/*.min.js",
              "**/*.min.css"
            ],
            "format": ["python", "javascript", "typescript", "matlab"],
            "absolute": true,
            "gitignore": true
          }
          EOF

          # Run jscpd and capture output
          jscpd src --output ./jscpd-report 2>&1 || true

          echo "### Duplication Summary" >> $GITHUB_STEP_SUMMARY

          if [ -f "./jscpd-report/jscpd-report.json" ]; then
            # Parse JSON report
              python3 <<'PYCODE' 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Could not parse duplicates" >> $GITHUB_STEP_SUMMARY
              import json
              from pathlib import Path
                            report = Path('./jscpd-report/jscpd-report.json')
              data = json.loads(report.read_text())
              for i, dup in enumerate(data.get('duplicates', [])[:10], start=1):
              first = dup.get('firstFile', {})
              second = dup.get('secondFile', {})
              lines = dup.get('lines', 0)
              print(f"{i}. {lines} lines duplicated:")
              print(f"   {first.get('name', '')}:{first.get('startLoc', {}).get('line', '')}")
              print(f"   {second.get('name', '')}:{second.get('startLoc', {}).get('line', '')}")
              print()
              PYCODE
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No duplication report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check scripts directory
        run: |
          if [ -d "scripts" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Scripts Directory Duplication" >> $GITHUB_STEP_SUMMARY
            jscpd scripts --reporters console 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          fi

  summary:
    name: Metrics Summary
    needs: [pick-runner, complexity-metrics, duplication-metrics]
    if: always()
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Final Summary
        run: |
          echo "## Code Metrics Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is an **informational report** - it does not block CI." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- **Complexity**: Refactor functions with Grade C or worse" >> $GITHUB_STEP_SUMMARY
          echo "- **Duplication**: Extract common code into shared utilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Maintainability**: Focus on files with MI score below 20" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Code Metrics workflow*" >> $GITHUB_STEP_SUMMARY
