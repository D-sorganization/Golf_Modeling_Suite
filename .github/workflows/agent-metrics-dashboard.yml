name: Agent Metrics Dashboard

on:
  # schedule: DISABLED to reduce CI cost (see #1751)
  # Every Monday at 10am UTC (after CI failure digest)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          ONLINE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then
            ONLINE=0
          fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
