version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - automated
  commit-message:
    prefix: chore(deps)
  groups:
    python-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - ci/cd
  - automated
  commit-message:
    prefix: 'chore(ci): '
    include: scope
  pull-request-branch-name:
    separator: /
  reviewers:
  - dieterolson
  allow:
  - dependency-type: all
- package-ecosystem: npm
  directory: /src/ui
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - frontend
  - automated
  commit-message:
    prefix: chore(ui-deps)
