# UpstreamDrift Rust Workspace
# Phase 2: Physics kernels consuming tools-core from the Tools hub.
# See: https://github.com/D-sorganization/UpstreamDrift/issues/1639

[workspace]
resolver = "2"
members = ["rust_core/upstream-physics"]
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["D-sorganization"]
repository = "https://github.com/D-sorganization/UpstreamDrift"

[workspace.dependencies]
# Shared kernel from Tools repository.
# LOCAL DEV: requires the Tools repo checked out as a sibling directory
#   (i.e. ../Tools/rust_core/tools-core must exist).
#   Run scripts/setup_tools_workspace.sh to create the required symlink.
# CI: scripts/setup_tools_workspace.sh creates a symlink before cargo build,
#   resolving this path without a real sibling checkout.
# FUTURE: replace with a git submodule or published crate to remove the
#   sibling-repo requirement for contributors.
tools-core = { path = "../Tools/rust_core/tools-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
